name: Repo Knowledge Sync

# Rollout of soobujmiah/skb's governance/DETERMINISTIC_STATE_SYNC_POLICY.md to this repository
# (DEC-2026-09-25-002). tools/repo_knowledge/ and schemas/*.schema.json are vendored copies from
# soobujmiah/skb -- see tools/repo_knowledge/README.md. Do not hand-edit .repo/; it is
# regenerated by this workflow.
#
# Like lai (and unlike ggen/onskillit/songjog/portfolio), this does NOT re-run the "CI" workflow's
# heavy Build (Linux ARM64) matrix (60 min timeout x 3 AOSP versions, clones ~38 AOSP repos per
# leg -- AI_ASSISTANT.md explicitly says not to re-run this merely to confirm it works). Instead
# this workflow triggers via `workflow_run` when "CI" completes on main, and reads that run's own
# job conclusions through the GitHub API:
#   - test.status  <- the cheap "setup.sh unit tests" job (shell script tests, no AOSP clone).
#   - build.status <- all three "Build (Linux ARM64)" matrix legs; passed only if every leg did.
# pages.yml (the Jekyll docs site) is unrelated and not wired in.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Run tools/repo_knowledge tests
        run: python3 -m unittest discover -s tools/repo_knowledge/tests -p 'test_*.py' -v

  sync:
    needs: test
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Checking out an exact SHA leaves Git detached; restore the branch name so
      # core.py's `git rev-parse --abbrev-ref HEAD` reports "main", not "HEAD"
      # (found the hard way on lai's rollout).
      - name: Restore branch name after exact-SHA checkout
        run: git checkout -B "${{ github.event.workflow_run.head_branch || github.ref_name }}"

      - name: Install dependencies
        run: pip install --quiet pyyaml

      - name: Derive build/test status from the CI run
        id: derive
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            --paginate > jobs.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("jobs.json") as f:
              jobs = json.load(f)["jobs"]

          test_job = next((j for j in jobs if j["name"] == "setup.sh unit tests"), None)
          build_jobs = [j for j in jobs if j["name"].startswith("Build (Linux ARM64)")]

          test_status = {"success": "passed", "failure": "failed"}.get(
              test_job["conclusion"] if test_job else None, ""
          )

          if build_jobs and all(j["conclusion"] == "success" for j in build_jobs):
              build_status = "passed"
          elif any(j["conclusion"] == "failure" for j in build_jobs):
              build_status = "failed"
          else:
              build_status = ""

          print(f"test_status={test_status}")
          print(f"build_status={build_status}")
          PY

      - name: Collect and sync deterministic state
        if: always()
        run: |
          set -euo pipefail
          args=(--ci --build-run-id "${{ github.event.workflow_run.id || github.run_id }}")
          if [ -n "${{ steps.derive.outputs.build_status }}" ]; then
            args+=(--build-status "${{ steps.derive.outputs.build_status }}")
          fi
          if [ -n "${{ steps.derive.outputs.test_status }}" ]; then
            args+=(--test-status "${{ steps.derive.outputs.test_status }}" --test-summary "setup.sh unit tests (ci.yml)")
          fi
          python3 -m tools.repo_knowledge sync "${args[@]}"

      - name: Verify .repo/ against schemas
        if: always()
        run: python3 -m tools.repo_knowledge verify

      - name: Commit updated .repo/ state
        if: >-
          always() &&
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        run: |
          set -euo pipefail
          if git diff --quiet -- .repo; then
            echo "no .repo/ change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .repo
          git commit -m "chore(repo-knowledge): sync deterministic state for ${{ github.event.workflow_run.head_sha }}"
          git push origin HEAD:main
