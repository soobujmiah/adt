<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="rel-title rel-desc">
  <title id="rel-title">ADT and TERNUX Relationship</title>
  <desc id="rel-desc">Two distinct layers sharing one ARM64 physical Android device: TERNUX provides the Linux desktop and GPU acceleration; ADT provides the native Android SDK build and deployment toolchain.</desc>
  <rect width="1200" height="480" rx="16" fill="#050507" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
  <text x="50" y="52" fill="#e4e2df" font-family="'Space Grotesk', system-ui, 'Noto Sans Bengali', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">ADT ও TERNUX · পারস্পরিক কাঠামো</text>
  <text x="50" y="78" fill="rgba(228,226,223,0.45)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="12" letter-spacing="0.06em">একই ARM64 পরিসরের দুই স্তর · অভিন্ন যন্ত্রভিত্তি · স্বতন্ত্র প্রকল্প</text>

  <!-- Base Layer: Physical Android Hardware -->
  <rect x="50" y="110" width="1100" height="85" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,211,238,0.35)" stroke-width="1.2"/>
  <text x="75" y="145" fill="#22d3ee" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="17" font-weight="700">বাস্তব Android হোস্ট যন্ত্র (ARM64)</text>
  <text x="75" y="172" fill="rgba(228,226,223,0.72)" font-size="13">নিজস্ব CPU · Adreno GPU · মেমোরি · Android Linux কার্নেল · Termux + PRoot ব্যবহারকারী-পরিসর (root লাগে না)</text>
  <rect x="990" y="130" width="135" height="24" rx="12" fill="rgba(34,211,238,0.12)" stroke="rgba(34,211,238,0.4)" stroke-width="1"/>
  <text x="1057" y="146" fill="#22d3ee" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">বাস্তব হোস্ট</text>

  <!-- Side-by-Side Layers -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <!-- Left: TERNUX -->
    <rect x="50" y="235" width="530" height="185" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,197,94,0.4)" stroke-width="1.2"/>
    <text x="75" y="270" fill="#4ade80" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="20" font-weight="700">TERNUX</text>
    <text x="175" y="270" fill="rgba(228,226,223,0.45)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">soobujmiah/ternux</text>
    <text x="75" y="298" fill="#e4e2df" font-size="14" font-weight="600">লিনাক্স ডেস্কটপ ও কর্মযন্ত্র স্তর</text>
    <path d="M75 312h480" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="75" y="336" fill="rgba(228,226,223,0.65)" font-size="12.5">• Debian ব্যবহারকারী-পরিসর + Xfce4 ডেস্কটপ + Termux:X11 পর্দা</text>
    <text x="75" y="358" fill="rgba(228,226,223,0.65)" font-size="12.5">• পূর্ণ মাল্টিমিডিয়ার জন্য PulseAudio শব্দ-সংযোগ</text>
    <text x="75" y="380" fill="rgba(228,226,223,0.65)" font-size="12.5">• GPU ত্বরণ: Adreno-তে Mesa/Zink Turnip, বিকল্পে VirGL</text>
    <text x="75" y="402" fill="rgba(34,197,94,0.75)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11">লক্ষ্য: ফোনে ডেস্কটপ কাজ ও Linux IDE চালানো</text>

    <!-- Right: ADT -->
    <rect x="620" y="235" width="530" height="185" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(168,85,247,0.4)" stroke-width="1.2"/>
    <text x="645" y="270" fill="#c084fc" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="20" font-weight="700">ADT</text>
    <text x="700" y="270" fill="rgba(228,226,223,0.45)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">soobujmiah/adt (এই প্রকল্প)</text>
    <text x="645" y="298" fill="#e4e2df" font-size="14" font-weight="600">নিজস্ব Android উন্নয়ন সরঞ্জামস্তর</text>
    <path d="M645 312h480" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="645" y="336" fill="rgba(228,226,223,0.65)" font-size="12.5">• এওএসপি-র aarch64 নির্মাণ-সরঞ্জাম (aapt2, zipalign, apksigner)</text>
    <text x="645" y="358" fill="rgba(228,226,223,0.65)" font-size="12.5">• নিজস্ব platform-tools (adb, fastboot), স্থানীয় যন্ত্র-সংযোগসহ</text>
    <text x="645" y="380" fill="rgba(228,226,223,0.65)" font-size="12.5">• যন্ত্রেই শুরু থেকে শেষ পর্যন্ত APK নির্মাণ, স্বাক্ষর, স্থাপন ও যাচাই</text>
    <text x="645" y="402" fill="rgba(192,132,252,0.85)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11">লক্ষ্য: x86_64 PC ছাড়া Android অ্যাপ উন্নয়ন</text>
  </g>

  <!-- Connecting Arrows -->
  <path d="M315 195v40M885 195v40" stroke="rgba(228,226,223,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M311 230l4 6 4-6zM881 230l4 6 4-6z" fill="rgba(228,226,223,0.45)"/>

  <text x="50" y="455" fill="rgba(228,226,223,0.4)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">একই যন্ত্রে সহাবস্থান যাচাইকৃত; যৌথ পরিচালনা এখনো পরীক্ষাধীন · দুই প্রকল্পের সংগ্রহশালা আলাদা।</text>
</svg>
