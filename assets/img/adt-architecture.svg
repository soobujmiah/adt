<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ADT Architecture Overview</title>
  <desc id="arch-desc">Native ARM64 Android development toolchain built from AOSP source, running in Linux ARM64 userspace and targeting the physical Android host device via ADB.</desc>
  <rect width="1200" height="480" rx="16" fill="#050507" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
  <text x="50" y="52" fill="#e4e2df" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">ADT · Architecture Overview</text>
  <text x="50" y="78" fill="rgba(228,226,223,0.45)" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="0.06em">AOSP-SOURCED NATIVE AARCH64 TOOLS · LINUX / PROOT DEBIAN HOST · REAL-DEVICE VALIDATED</text>

  <!-- Layer 1: Host Environment -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="50" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,211,238,0.35)" stroke-width="1.2"/>
    <text x="75" y="144" fill="#22d3ee" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Linux ARM64 Host</text>
    <text x="75" y="168" fill="rgba(228,226,223,0.72)" font-size="13">Termux + PRoot Debian or Linux aarch64</text>
    <path d="M75 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="75" y="210" fill="#e4e2df" font-size="13" font-weight="600">Core Toolchains:</text>
    <text x="75" y="234" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• OpenJDK 17 / 21 (aarch64)</text>
    <text x="75" y="258" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• CMake &amp; Ninja (native Linux)</text>
    <text x="75" y="282" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Clang / NDK compiler shims</text>
    <text x="75" y="306" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Python 3 &amp; Go (build drivers)</text>
    <text x="75" y="338" fill="rgba(228,226,223,0.4)" font-size="11">No x86_64 host or translation layer needed</text>
    <text x="75" y="358" fill="rgba(228,226,223,0.4)" font-size="11">All builds execute directly on ARM64 silicon</text>
  </g>

  <!-- Layer 2: ADT Native Binaries -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="430" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,197,94,0.4)" stroke-width="1.2"/>
    <text x="455" y="144" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">ADT Native Toolchain</text>
    <text x="455" y="168" fill="rgba(228,226,223,0.72)" font-size="13">Compiled from official AOSP source</text>
    <path d="M455 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="455" y="210" fill="#e4e2df" font-size="13" font-weight="600">SDK Build-Tools:</text>
    <text x="455" y="234" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• aapt2 · aapt · aidl</text>
    <text x="455" y="258" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• zipalign · apksigner · split-select</text>
    <text x="455" y="286" fill="#e4e2df" font-size="13" font-weight="600">Platform-Tools:</text>
    <text x="455" y="310" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• adb (native client &amp; server bridge)</text>
    <text x="455" y="334" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• fastboot · mke2fs.android · etc1tool</text>
    <text x="455" y="366" fill="rgba(34,197,94,0.75)" font-family="'JetBrains Mono', monospace" font-size="10.5">Offline-installable &amp; reproducible</text>
  </g>

  <!-- Layer 3: Physical Device Target -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="810" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(245,158,11,0.35)" stroke-width="1.2"/>
    <text x="835" y="144" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">Physical Host Device</text>
    <text x="835" y="168" fill="rgba(228,226,223,0.72)" font-size="13">Real hardware (Not an external emulator!)</text>
    <path d="M835 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="835" y="210" fill="#e4e2df" font-size="13" font-weight="600">Target Execution Subsystem:</text>
    <text x="835" y="234" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Android adbd (localhost:5555 / USB)</text>
    <text x="835" y="258" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Package Manager: pm install -r APK</text>
    <text x="835" y="282" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Activity Manager: am start -n ...</text>
    <text x="835" y="306" fill="rgba(228,226,223,0.6)" font-family="'JetBrains Mono', monospace" font-size="11.5">• Diagnostics: logcat &amp; process tracing</text>
    <text x="835" y="338" fill="rgba(228,226,223,0.4)" font-size="11">App executes natively on bare-metal CPU</text>
    <text x="835" y="358" fill="rgba(228,226,223,0.4)" font-size="11">Direct access to camera, GPU, sensors</text>
  </g>

  <!-- Connectors -->
  <path d="M390 265h40" stroke="rgba(228,226,223,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M425 261l6 4-6 4z" fill="rgba(228,226,223,0.45)"/>
  <path d="M770 265h40" stroke="rgba(228,226,223,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M805 261l6 4-6 4z" fill="rgba(228,226,223,0.45)"/>

  <text x="50" y="452" fill="rgba(228,226,223,0.4)" font-family="'JetBrains Mono', monospace" font-size="11.5">Evidence boundary: Verified end-to-end on Redmi Turbo 4 Pro (Android 16 / API 36) · See docs/REAL_DEVICE_BUILD_VALIDATION.md</text>
</svg>
