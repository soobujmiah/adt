<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">ADT Architecture Overview</title>
  <desc id="arch-desc">Native ARM64 Android development toolchain built from AOSP source, running in Linux ARM64 userspace and targeting the physical Android host device via ADB.</desc>
  <rect width="1200" height="480" rx="16" fill="#050507" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
  <text x="50" y="52" fill="#e4e2df" font-family="'Space Grotesk', system-ui, 'Noto Sans Bengali', sans-serif" font-size="24" font-weight="700" letter-spacing="-0.02em">ADT · কাঠামোর পরিচিতি</text>
  <text x="50" y="78" fill="rgba(228,226,223,0.45)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="12" letter-spacing="0.06em">এওএসপি-র নিজস্ব AARCH64 সরঞ্জাম · লিনাক্স / PRoot ডেবিয়ান হোস্ট · বাস্তব যন্ত্রে যাচাইকৃত</text>

  <!-- Layer 1: Host Environment -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="50" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,211,238,0.35)" stroke-width="1.2"/>
    <text x="75" y="144" fill="#22d3ee" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700">লিনাক্স ARM64 হোস্ট</text>
    <text x="75" y="168" fill="rgba(228,226,223,0.72)" font-size="13">Termux + PRoot Debian অথবা Linux aarch64</text>
    <path d="M75 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="75" y="210" fill="#e4e2df" font-size="13" font-weight="600">মূল সরঞ্জামসমষ্টি:</text>
    <text x="75" y="234" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• OpenJDK 17 / 21 (aarch64)</text>
    <text x="75" y="258" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• CMake ও Ninja (নিজস্ব Linux)</text>
    <text x="75" y="282" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• Clang / NDK কম্পাইলার শিম</text>
    <text x="75" y="306" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• Python 3 ও Go (নির্মাণ সহায়ক)</text>
    <text x="75" y="338" fill="rgba(228,226,223,0.4)" font-size="11">x86_64 হোস্ট বা রূপান্তর স্তর লাগে না</text>
    <text x="75" y="358" fill="rgba(228,226,223,0.4)" font-size="11">সব নির্মাণ সরাসরি ARM64 প্রসেসরে চলে</text>
  </g>

  <!-- Layer 2: ADT Native Binaries -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="430" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,197,94,0.4)" stroke-width="1.2"/>
    <text x="455" y="144" fill="#4ade80" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700">ADT নিজস্ব সরঞ্জামসমষ্টি</text>
    <text x="455" y="168" fill="rgba(228,226,223,0.72)" font-size="13">এওএসপি-র মূল কোড থেকে কম্পাইল করা</text>
    <path d="M455 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="455" y="210" fill="#e4e2df" font-size="13" font-weight="600">SDK নির্মাণ-সরঞ্জাম:</text>
    <text x="455" y="234" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• aapt2 · aapt · aidl</text>
    <text x="455" y="258" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• zipalign · apksigner · split-select</text>
    <text x="455" y="286" fill="#e4e2df" font-size="13" font-weight="600">প্ল্যাটফর্ম-সরঞ্জাম:</text>
    <text x="455" y="310" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• adb (নিজস্ব ক্লায়েন্ট ও সার্ভার সংযোগ)</text>
    <text x="455" y="334" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• fastboot · mke2fs.android · etc1tool</text>
    <text x="455" y="366" fill="rgba(34,197,94,0.75)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="10.5">নেটওয়ার্ক ছাড়া স্থাপনযোগ্য ও পুনরুৎপাদনযোগ্য</text>
  </g>

  <!-- Layer 3: Physical Device Target -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="810" y="110" width="340" height="310" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(245,158,11,0.35)" stroke-width="1.2"/>
    <text x="835" y="144" fill="#f59e0b" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="16" font-weight="700">বাস্তব হোস্ট যন্ত্র</text>
    <text x="835" y="168" fill="rgba(228,226,223,0.72)" font-size="13">আসল যন্ত্র (বাহ্যিক এমুলেটর নয়!)</text>
    <path d="M835 184h290" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
    <text x="835" y="210" fill="#e4e2df" font-size="13" font-weight="600">লক্ষ্য যন্ত্রে চালনার অংশ:</text>
    <text x="835" y="234" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• অ্যান্ড্রয়েড adbd (localhost:5555 / USB)</text>
    <text x="835" y="258" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• প্যাকেজ ব্যবস্থাপক: pm install -r APK</text>
    <text x="835" y="282" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• অ্যাক্টিভিটি ব্যবস্থাপক: am start -n ...</text>
    <text x="835" y="306" fill="rgba(228,226,223,0.6)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">• ত্রুটি নির্ণয়: logcat ও প্রক্রিয়া পর্যবেক্ষণ</text>
    <text x="835" y="338" fill="rgba(228,226,223,0.4)" font-size="11">অ্যাপ সরাসরি প্রসেসরে চলে</text>
    <text x="835" y="358" fill="rgba(228,226,223,0.4)" font-size="11">ক্যামেরা, GPU ও সেন্সরে সরাসরি প্রবেশ</text>
  </g>

  <!-- Connectors -->
  <path d="M390 265h40" stroke="rgba(228,226,223,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M425 261l6 4-6 4z" fill="rgba(228,226,223,0.45)"/>
  <path d="M770 265h40" stroke="rgba(228,226,223,0.25)" stroke-width="1.5" fill="none"/>
  <path d="M805 261l6 4-6 4z" fill="rgba(228,226,223,0.45)"/>

  <text x="50" y="452" fill="rgba(228,226,223,0.4)" font-family="system-ui, 'Noto Sans Bengali', sans-serif" font-size="11.5">প্রমাণ: Redmi Turbo 4 Pro (Android 16 / API 36)-এ শুরু থেকে শেষ পর্যন্ত যাচাইকৃত · docs/REAL_DEVICE_BUILD_VALIDATION.md দেখুন</text>
</svg>
