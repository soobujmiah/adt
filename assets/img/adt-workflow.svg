<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="wf-title wf-desc">
  <title id="wf-title">ADT On-Device Pipeline &amp; Closed-Loop Automation</title>
  <desc id="wf-desc">Diagram showing the verified on-device APK build-test workflow and distinguishing it from possible future closed-loop agent automation.</desc>
  <rect width="1200" height="520" rx="16" fill="#050507" stroke="rgba(228,226,223,0.08)" stroke-width="1"/>
  <text x="50" y="48" fill="#e4e2df" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em">ADT · On-Device Pipeline &amp; Automation Architecture</text>
  <text x="50" y="72" fill="rgba(228,226,223,0.45)" font-family="'JetBrains Mono', monospace" font-size="11.5" letter-spacing="0.06em">DISTINGUISHING CURRENT VERIFIED CAPABILITY FROM FUTURE AGENT-DRIVEN AUTOMATION</text>

  <!-- Section 1: Verified Workflow (Upper Box) -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="50" y="96" width="1100" height="175" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(34,197,94,0.4)" stroke-width="1.2"/>
    <text x="75" y="126" fill="#4ade80" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Verified Today: Complete On-Device Pipeline</text>
    <rect x="990" y="112" width="135" height="22" rx="11" fill="rgba(34,197,94,0.12)" stroke="rgba(34,197,94,0.4)" stroke-width="1"/>
    <text x="1057" y="127" fill="#4ade80" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">VERIFIED / CLOSED</text>

    <!-- 5 Steps -->
    <rect x="75" y="148" width="185" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="90" y="174" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">01 · COMPILE</text>
    <text x="90" y="198" fill="#e4e2df" font-size="12" font-weight="600">AAPT2 + javac/d8</text>
    <text x="90" y="218" fill="rgba(228,226,223,0.5)" font-size="11">Compile XML, JNI, dex</text>
    <text x="90" y="234" fill="rgba(228,226,223,0.5)" font-size="11">Create unsigned APK</text>

    <rect x="295" y="148" width="185" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="310" y="174" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">02 · PACKAGE</text>
    <text x="310" y="198" fill="#e4e2df" font-size="12" font-weight="600">zipalign + apksigner</text>
    <text x="310" y="218" fill="rgba(228,226,223,0.5)" font-size="11">4-byte alignment</text>
    <text x="310" y="234" fill="rgba(228,226,223,0.5)" font-size="11">v2/v3 cryptographic sign</text>

    <rect x="515" y="148" width="185" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="530" y="174" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">03 · DEPLOY</text>
    <text x="530" y="198" fill="#e4e2df" font-size="12" font-weight="600">Native adb install</text>
    <text x="530" y="218" fill="rgba(228,226,223,0.5)" font-size="11">Stream APK to adbd</text>
    <text x="530" y="234" fill="rgba(228,226,223,0.5)" font-size="11">Target: physical phone</text>

    <rect x="735" y="148" width="185" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="750" y="174" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">04 · EXECUTE</text>
    <text x="750" y="198" fill="#e4e2df" font-size="12" font-weight="600">Activity Manager</text>
    <text x="750" y="218" fill="rgba(228,226,223,0.5)" font-size="11">am start -n &lt;component&gt;</text>
    <text x="750" y="234" fill="rgba(228,226,223,0.5)" font-size="11">Launches on bare metal</text>

    <rect x="955" y="148" width="170" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="970" y="174" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">05 · VALIDATE</text>
    <text x="970" y="198" fill="#e4e2df" font-size="12" font-weight="600">Logcat &amp; JNI checks</text>
    <text x="970" y="218" fill="rgba(228,226,223,0.5)" font-size="11">Confirm arm64-v8a load</text>
    <text x="970" y="234" fill="rgba(228,226,223,0.5)" font-size="11">Zero fatal exceptions</text>

    <path d="M260 198h35M480 198h35M700 198h35M920 198h35" stroke="rgba(228,226,223,0.2)" stroke-width="1.5" fill="none"/>
    <path d="M290 194l5 4-5 4zM510 194l5 4-5 4zM730 194l5 4-5 4zM950 194l5 4-5 4z" fill="rgba(228,226,223,0.4)"/>
  </g>

  <!-- Section 2: Potential Agent Loop (Lower Box) -->
  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="50" y="295" width="1100" height="175" rx="12" fill="rgba(6,7,6,0.66)" stroke="rgba(245,158,11,0.35)" stroke-width="1.2"/>
    <text x="75" y="325" fill="#f59e0b" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Possible with Authorized Automation: Closed-Loop Agent Feedback</text>
    <rect x="990" y="311" width="135" height="22" rx="11" fill="rgba(245,158,11,0.12)" stroke="rgba(245,158,11,0.4)" stroke-width="1"/>
    <text x="1057" y="326" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">EXPERIMENTAL</text>

    <!-- 4 Stages of Agent Loop -->
    <rect x="75" y="347" width="235" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="90" y="373" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">A · AGENT ITERATION</text>
    <text x="90" y="397" fill="#e4e2df" font-size="12" font-weight="600">Code change &amp; commit</text>
    <text x="90" y="417" fill="rgba(228,226,223,0.5)" font-size="11">Agent drafts patch / feature</text>
    <text x="90" y="433" fill="rgba(228,226,223,0.5)" font-size="11">Pushes branch to GitHub</text>

    <rect x="350" y="347" width="235" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="365" y="373" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">B · CLOUD OR HOST BUILD</text>
    <text x="365" y="397" fill="#e4e2df" font-size="12" font-weight="600">CI produces APK artifact</text>
    <text x="365" y="417" fill="rgba(228,226,223,0.5)" font-size="11">Build artifacts compiled &amp; signed</text>
    <text x="365" y="433" fill="rgba(228,226,223,0.5)" font-size="11">Artifact retrieved by local device</text>

    <rect x="625" y="347" width="235" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="640" y="373" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">C · ADT DEPLOY &amp; TEST</text>
    <text x="640" y="397" fill="#e4e2df" font-size="12" font-weight="600">Host installation &amp; run</text>
    <text x="640" y="417" fill="rgba(228,226,223,0.5)" font-size="11">ADB installs APK on real target</text>
    <text x="640" y="433" fill="rgba(228,226,223,0.5)" font-size="11">Executes instrumentation tests</text>

    <rect x="900" y="347" width="225" height="100" rx="8" fill="#090d0b" stroke="rgba(228,226,223,0.09)" stroke-width="1"/>
    <text x="915" y="373" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">D · TELEMETRY RETURN</text>
    <text x="915" y="397" fill="#e4e2df" font-size="12" font-weight="600">Crash &amp; logcat ingestion</text>
    <text x="915" y="417" fill="rgba(228,226,223,0.5)" font-size="11">Agent reviews execution logs</text>
    <text x="915" y="433" fill="rgba(228,226,223,0.5)" font-size="11">Loops back to next code fix</text>

    <path d="M310 397h40M585 397h40M860 397h40" stroke="rgba(228,226,223,0.2)" stroke-width="1.5" fill="none"/>
    <path d="M345 393l5 4-5 4zM620 393l5 4-5 4zM895 393l5 4-5 4z" fill="rgba(228,226,223,0.4)"/>
  </g>

  <text x="50" y="495" fill="rgba(228,226,223,0.4)" font-family="'JetBrains Mono', monospace" font-size="11">Note: Autonomous closed-loop iteration requires authorized agent infrastructure; ADT provides the underlying native tooling layer today.</text>
</svg>
