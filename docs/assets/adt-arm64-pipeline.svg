<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">ADT ARM64 Android development pipeline</title>
<desc id="desc">Diagram showing native AOSP source flowing through ARM64 Linux build tools to APK signing, ADB installation, JNI loading and real-device validation.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07140d"/><stop offset="1" stop-color="#0d2417"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#102b1a"/><stop offset="1" stop-color="#0b1f14"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".28"/></filter></defs>
<rect width="1200" height="560" rx="28" fill="url(#bg)"/>
<text x="60" y="62" fill="#8ff0ad" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="3">ADT · ARM64 ANDROID DEVELOPMENT PIPELINE</text>
<text x="60" y="96" fill="#eef8f0" font-family="sans-serif" font-size="28" font-weight="700">Native source → real-device execution</text>
<g font-family="sans-serif" filter="url(#shadow)">
<g transform="translate(55 150)"><rect width="200" height="150" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="22" y="40" fill="#8ff0ad" font-size="14" font-weight="700">01 · SOURCE</text><text x="22" y="75" fill="#fff" font-size="20" font-weight="700">AOSP source</text><text x="22" y="103" fill="#b8cfc0" font-size="14">Native ARM64/glibc</text><text x="22" y="125" fill="#b8cfc0" font-size="14">toolchain inputs</text></g>
<g transform="translate(300 150)"><rect width="200" height="150" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="22" y="40" fill="#8ff0ad" font-size="14" font-weight="700">02 · BUILD</text><text x="22" y="75" fill="#fff" font-size="20" font-weight="700">SDK tools</text><text x="22" y="103" fill="#b8cfc0" font-size="14">aapt2 · aidl · adb</text><text x="22" y="125" fill="#b8cfc0" font-size="14">CMake · Ninja · JDK</text></g>
<g transform="translate(545 150)"><rect width="200" height="150" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="22" y="40" fill="#8ff0ad" font-size="14" font-weight="700">03 · PACKAGE</text><text x="22" y="75" fill="#fff" font-size="20" font-weight="700">APK</text><text x="22" y="103" fill="#b8cfc0" font-size="14">compile · package</text><text x="22" y="125" fill="#b8cfc0" font-size="14">sign · verify</text></g>
<g transform="translate(790 150)"><rect width="200" height="150" rx="18" fill="url(#card)" stroke="#2c6b43"/><text x="22" y="40" fill="#8ff0ad" font-size="14" font-weight="700">04 · DEVICE</text><text x="22" y="75" fill="#fff" font-size="20" font-weight="700">ADB install</text><text x="22" y="103" fill="#b8cfc0" font-size="14">arm64-v8a selection</text><text x="22" y="125" fill="#b8cfc0" font-size="14">JNI/native loading</text></g>
<g transform="translate(420 370)"><rect width="360" height="120" rx="20" fill="#123820" stroke="#67d88c" stroke-width="2"/><text x="28" y="42" fill="#9af4b5" font-size="14" font-weight="700">05 · EVIDENCE</text><text x="28" y="73" fill="#fff" font-size="20" font-weight="700">Physical-device validation</text><text x="28" y="98" fill="#c4ddcc" font-size="14">run → inspect → measure → document</text></g></g>
<g stroke="#63d487" stroke-width="3" fill="none" stroke-linecap="round"><path d="M255 225h45"/><path d="M500 225h45"/><path d="M745 225h45"/><path d="M890 300v55"/><path d="M890 355H780"/></g>
<text x="60" y="525" fill="#8da897" font-family="sans-serif" font-size="13">ARM64 Linux host · offline-installable verified artifacts · evidence vocabulary: Verified / Measured / Observed / Experimental</text>
</svg>