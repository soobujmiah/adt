<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }} — ADT</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="author" content="Sobuj Miah">
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta name="theme-color" content="#050507">
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="ADT">
  <meta property="og:title" content="{{ page.title | default: site.title }} — ADT">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
  <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og-card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="ADT documentation — native ARM64 Android build and validation toolchain">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ page.title | default: site.title }} — ADT">
  <meta name="twitter:description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/assets/img/og-card.png">
  <meta name="twitter:image:alt" content="ADT documentation — native ARM64 Android build and validation toolchain">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23050507%22/><path d=%22M14 18l14 14-14 14M34 46h16%22 fill=%22none%22 stroke=%22%2322c55e%22 stroke-width=%226%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/></svg>">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/adt.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "TechArticle",
        "headline": "{{ page.title | default: site.title | escape }}",
        "description": "{{ page.description | default: site.description | strip_newlines | escape }}",
        "url": "{{ site.url }}{{ site.baseurl }}{{ page.url }}",
        "author": { "@type": "Person", "name": "Sobuj Miah", "url": "https://soobujmiah.github.io/" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Portfolio", "item": "https://soobujmiah.github.io/" },
          { "@type": "ListItem", "position": 2, "name": "ADT", "item": "https://soobujmiah.github.io/adt/" },
          { "@type": "ListItem", "position": 3, "name": "{{ page.title | default: 'Documentation' | escape }}", "item": "{{ site.url }}{{ site.baseurl }}{{ page.url }}" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  {% include header.html %}
  <main class="wrap" id="main">
    {{ content }}
  </main>
  {% include footer.html %}
  <script src="{{ site.baseurl }}/assets/js/codecopy.js" defer></script>
</body>
</html>
